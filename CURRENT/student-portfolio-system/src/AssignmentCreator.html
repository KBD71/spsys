<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
    <style>
        .container {
            padding: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
        }

        #questions-container .question-item {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }
        
        .question-main-row {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .question-main-row input[type="text"] {
            flex-grow: 1;
            margin-right: 5px;
        }
        
        .supplement-row {
            display: flex;
            align-items: center;
            margin-left: 20px;
            font-size: 12px;
        }
        
        .supplement-row input[type="checkbox"] {
            margin-right: 5px;
        }
        
        .supplement-row input[type="text"] {
            width: 200px;
            margin-left: 5px;
            padding: 4px;
            font-size: 12px;
            display: none;
        }

        .remove-btn {
            color: #fff;
            background-color: #dc3545;
            border: none;
            cursor: pointer;
            padding: 2px 6px;
            font-weight: bold;
        }

        #status {
            margin-top: 10px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        .checkbox-group label {
            margin-bottom: 0;
            font-weight: normal;
        }

        .help-text {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h4>새 평가/과제 정보</h4>
        <div class="form-group">
            <label for="assignmentName">평가(과제)명</label>
            <input type="text" id="assignmentName" placeholder="예: 1학기 수행평가 피드백">
        </div>
        <div class="form-group">
            <label for="description">설명 (선택)</label>
            <textarea id="description" rows="3" placeholder="안내사항을 입력하세요."></textarea>
        </div>
        
        <div class="form-group">
            <label for="targetClass">대상반 지정 (옵션)</label>
            <input type="text" id="targetClass" placeholder="예: 기하203">
            <div class="help-text">비워두거나 '전체'로 쓰면 모든 반에 공개됩니다. 특정 반만 공개하려면 쉼표로 구분해 적어주세요.</div>
        </div>

        <hr>

        <h4>질문 목록</h4>
        <div id="questions-container"></div>
        <button id="addQuestionBtn">➕ 질문 추가</button>

        <hr style="margin-top: 20px;">

        <button id="createBtn" class="action">평가 시트 생성하기</button>
        <p id="status"></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            addQuestionField(); 

            document.getElementById('addQuestionBtn').addEventListener('click', addQuestionField);
            document.getElementById('createBtn').addEventListener('click', createAssignment);
            
            document.getElementById('questions-container').addEventListener('click', function (e) {
                if (e.target && e.target.classList.contains('remove-btn')) {
                    e.target.closest('.question-item').remove();
                }
            });
            
            document.getElementById('questions-container').addEventListener('change', function (e) {
                if (e.target && e.target.classList.contains('supplement-check')) {
                    var input = e.target.closest('.supplement-row').querySelector('.supplement-input');
                    if (e.target.checked) {
                        input.style.display = 'inline-block';
                    } else {
                        input.style.display = 'none';
                        input.value = '';
                    }
                }
            });
        });

        function addQuestionField() {
            var container = document.getElementById('questions-container');
            var questionCount = container.children.length;

            if (questionCount >= 20) {
                alert('질문은 최대 20개까지 추가할 수 있습니다.');
                return;
            }

            var div = document.createElement('div');
            div.className = 'question-item';
            div.innerHTML = `
                <div class="question-main-row">
                    <input type="text" class="question-text" placeholder="질문 ` + (questionCount + 1) + ` 내용 입력">
                    <button class="remove-btn">X</button>
                </div>
                <div class="supplement-row">
                    <input type="checkbox" class="supplement-check" id="supp_` + questionCount + `">
                    <label for="supp_` + questionCount + `">보조설명(교사기록) 추가</label>
                    <input type="text" class="supplement-input" placeholder="보조설명 열 이름 (예: 문제변형)">
                </div>
            `;
            container.appendChild(div);
        }

        function createAssignment() {
            var createBtn = document.getElementById('createBtn');
            var statusEl = document.getElementById('status');

            var assignmentData = {
                name: document.getElementById('assignmentName').value.trim(),
                description: document.getElementById('description').value,
                targetClass: document.getElementById('targetClass').value.trim() || '전체',
                questions: []
            };

            var questionItems = document.querySelectorAll('.question-item');
            questionItems.forEach(function (item) {
                var qText = item.querySelector('.question-text').value.trim();
                var hasSupplement = item.querySelector('.supplement-check').checked;
                var sText = item.querySelector('.supplement-input').value.trim();
                
                if (qText) {
                    assignmentData.questions.push({
                        text: qText,
                        supplement: hasSupplement && sText ? sText : null
                    });
                }
            });

            if (!assignmentData.name) {
                alert('평가명을 입력해주세요.');
                return;
            }
            if (assignmentData.questions.length === 0) {
                alert('최소 1개 이상의 질문을 입력해주세요.');
                return;
            }

            createBtn.disabled = true;
            statusEl.textContent = '시트를 생성 중입니다...';

            google.script.run
                .withSuccessHandler(function (response) {
                    statusEl.textContent = response;
                    createBtn.disabled = false;
                    setTimeout(function () { google.script.host.close(); }, 2000);
                })
                .withFailureHandler(function (error) {
                    alert('생성 실패: ' + error.message);
                    statusEl.textContent = '오류가 발생했습니다.';
                    createBtn.disabled = false;
                })
                .createAssignmentSheetFromSidebar(assignmentData);
        }
    </script>
</body>

</html>
